  <div class="app">

  <script src="./assets/anime.min.js"></script>
  <script type="module">
    import { animate as free26MotionAnimate } from "./assets/motion.mjs";
    window.free26MotionAnimate = free26MotionAnimate;
  </script>
  <script>
    // The page still renders from file:// if a browser blocks local ES modules.
    function motionAnimate(element,keyframes,options={}){
      if(typeof window.free26MotionAnimate==="function") return window.free26MotionAnimate(element,keyframes,options);
      if(!element||!element.animate) return Promise.resolve();
      const first={},last={},transforms=[];
      Object.keys(keyframes||{}).forEach(key=>{
        const values=Array.isArray(keyframes[key])?keyframes[key]:[keyframes[key],keyframes[key]];
        if(key==="x"||key==="y") transforms.push(["translate"+key.toUpperCase(),values]);
        else if(key==="scale") transforms.push(["scale",values]);
        else {first[key]=values[0];last[key]=values[values.length-1];}
      });
      if(transforms.length){
        first.transform=transforms.map(x=>x[0]+"("+x[1][0]+(x[0]==="scale"?"": "px")+")").join(" ");
        last.transform=transforms.map(x=>x[0]+"("+x[1][x[1].length-1]+(x[0]==="scale"?"": "px")+")").join(" ");
      }
      try{return element.animate([first,last],{duration:Math.max(150,Number(options.duration||.22)*1000),easing:"ease-out",fill:"both"}).finished.catch(()=>{});}
      catch(e){return Promise.resolve();}
    }

    const KEY = "free26_v1";
    const START = "2026-11-09";
    const END = "2027-01-31";

      openSheet("Вес тела",'<div class="field"><label>Вес, кг</label><input name="kg" type="number" min="1" max="400" step="0.1" required></div><div class="field"><label>Дата</label><input name="date" type="date" value="'+today()+'"></div>',fd=>{state.body.weights.push({date:fd.get("date")||today(),kg:Number(fd.get("kg"))});save();closeSheet();render();},"Добавить");

    function startTimer(){
      const t=state.skill.timer;
      if(t.running){t.elapsed=timerSeconds();t.running=false;t.startedAt=0;}
      else{t.running=true;t.startedAt=Date.now();}
      save();render();ensureTimerLoop();
    }
    function finishTimer(){
      const t=state.skill.timer, seconds=timerSeconds(), minutes=Math.min(40,Math.floor(seconds/60));
      if(minutes<=0){t.running=false;t.elapsed=0;save();render();return;}
      const oldLevel=skillLevel(Number(state.skill.xp||0)).level;
      const bonus=10, gained=minutes+bonus;
      const d=getDay(today()), skillTask=(d.snapshot||[]).find(x=>x.block==="skill");
      if(skillTask)d.done[skillTask.id]=true;
      else if(inPeriod(today())&&d.snapshot.length<10){
        const generated=task("Навык · 40 минут","skill",{id:"skill-timer-"+today(),kind:"timer"});
        d.snapshot.push(generated);d.done[generated.id]=true;
      }
      state.skill.xp=Number(state.skill.xp||0)+gained;
      state.skill.sessions.push({date:today(),minutes,xp:gained});
      t.running=false;t.startedAt=0;t.elapsed=0;syncDay(today());save();render();
      if(skillLevel(state.skill.xp).level>oldLevel){
        const level=skillLevel(state.skill.xp).level;
        openSheet("LEVEL UP",'<div class="pixel">'+Array.from({length:36},(_,i)=>'<i class="'+(i<Math.min(36,level*5)?"lit":"")+'"></i>').join("")+'</div><div class="level">Level '+level+'</div><div class="xp-text">+'+gained+' XP</div><div class="progress large"><div class="fill" data-value="100"></div></div>',()=>closeSheet(),"Продолжить");
        animateIn();
      }else toast("+"+gained+" XP");
    }

    function renderSkillTimer(){
      const el=$("#timer"); if(!el)return;
      const remain=Math.max(0,2400-Math.floor(timerSeconds())), value=String(Math.floor(remain/60)).padStart(2,"0")+":"+String(remain%60).padStart(2,"0");
      el.textContent=value;

    function ensureTimerLoop(){
      if(state.skill.timer.running&&!timerTick)timerTick=setInterval(renderSkillTimer,1000);
      if(!state.skill.timer.running&&timerTick){clearInterval(timerTick);timerTick=0;}
    }
    function toggleTask(date,id){
      const d=getDay(date,false);if(!d)return;
      if(date>today()||((date<today()||d.closed)&&!state.profile.allowPastEdit)){toast("Этот день закрыт");return;}
      const t=d.snapshot.find(x=>x.id===id);if(!t)return;
      const wasDone=!!d.done[id];
      if(wasDone){
        delete d.done[id];
        state.body.sessions=state.body.sessions.filter(x=>x.taskId!==id);
      }else{
        d.done[id]=true;vibrate();
      }
      syncDay(date);save();render();
      if(t.block==="body"&&!wasDone)openBodySession(id,t.title);

    function cycleMove(block,index,delta){
      const arr=state.cycle[cycleDay][block],n=index+delta;if(n<0||n>=arr.length)return;

    function saveProfile(form){
      const fd=new FormData(form), start=String(fd.get("start")),end=String(fd.get("end"));

      state.profile.start=start;state.profile.end=end;state.profile.thresholdPct=clamp(Number(fd.get("threshold")||80),1,100);
      state.profile.goals={body:Number(fd.get("goalBody")||0),money:Number(fd.get("moneyGoal")||0),skill:Number(fd.get("goalSkill")||0),god:Number(fd.get("goalGod")||0)};
      state.profile.skillName=String(fd.get("skillName")||"Навык").trim();state.money.goal=Number(fd.get("moneyGoal")||0);

    function exportData(){

    async function importFile(file){
      try{
        const raw=JSON.parse(await file.text());
        if(!raw||typeof raw!=="object"||!raw.profile||!raw.version)throw new Error("bad file");
        if(await confirmAction("Импортировать данные?","Текущая копия будет заменена данными из файла.","Импортировать")){
          state=migrate(raw);closeMissedDays();save();render();toast("Данные импортированы");
        }
      }catch(e){toast("Не удалось прочитать JSON");}
    }

      });
      $("#sheet-backdrop").addEventListener("click",e=>{if(e.target===backdrop)closeSheet();});
      screen.addEventListener("touchstart",e=>{if(view==="home"&&e.target.closest(".week-card"))screen.dataset.touchX=e.touches[0].clientX;},{passive:true});
      screen.addEventListener("touchend",e=>{
        if(view!=="home"||screen.dataset.touchX==null||!e.target.closest(".week-card")){delete screen.dataset.touchX;return;}
        const dx=e.changedTouches[0].clientX-Number(screen.dataset.touchX);delete screen.dataset.touchX;
        if(Math.abs(dx)>70)selectedDayFromWeek(dx<0?1:-1);
      },{passive:true});
    }

    closeMissedDays();
    if(inPeriod(today())&&!state.days[today()])state.days[today()]=buildSnapshot(today());
    if(!inPeriod(today())&&today()<state.profile.start)selectedDate=today();
    else if(today()>state.profile.end)selectedDate=state.profile.end;
    save();
    listen();
    render();
    if(state.skill.timer.running&&timerSeconds()>=2400)finishTimer();
    checkGodReminder();
    setInterval(checkGodReminder,30000);
    document.addEventListener("visibilitychange",()=>{
      if(document.visibilityState==="visible"){
        closeMissedDays();if(inPeriod(today())&&!state.days[today()])state.days[today()]=buildSnapshot(today());
        save();if(state.skill.timer.running&&!timerTick)timerTick=setInterval(renderSkillTimer,1000);render();checkGodReminder();
      }
    });
    function scheduleMidnight(){
      const now=new Date(),next=new Date(now);next.setHours(24,0,2,0);
      setTimeout(()=>{closeMissedDays();if(inPeriod(today())&&!state.days[today()])state.days[today()]=buildSnapshot(today());selectedDate=today();save();render();scheduleMidnight();},Math.max(1000,next-now));
    }
    scheduleMidnight();
    if("serviceWorker" in navigator && location.protocol!=="file:") navigator.serviceWorker.register("./sw.js").catch(()=>{});
  </script>
</body>
</html>
